services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc"]
      interval: 2s
      retries: 20
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://btc:btc@db:5432/btc
      APP_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
